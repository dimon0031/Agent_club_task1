{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <title>{% block title %}Тусовка{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'events/night.css' %}">
</head>
<body>
<header><nav class="wrap" aria-label="Головне меню">
  <a class="brand" href="{% url 'home' %}"><i class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b></i>Тусовка</a>
  <a class="nav-link" href="{% url 'home' %}#catalog">Афіша</a>
  {% if user.is_authenticated %}
    <a class="pill" href="{% url 'event-create' %}">Створити подію <span aria-hidden="true">↗</span></a>
    <span class="account">{{ user.email }}</span>
    <a class="nav-link" href="{% url 'profile' %}">Мій профіль</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet">Вийти</button></form>
  {% else %}
    <a class="nav-link" href="{% url 'login' %}">Увійти</a>
    <a class="pill" href="{% url 'register' %}">Зареєструватися <span aria-hidden="true">↗</span></a>
  {% endif %}
</nav></header>
<main class="wrap {% block layout %}interior{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
